[package]
name = "feox-loader-uefi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "feox-loader-uefi"
path = "src/main.rs"
test = false
bench = false

[dependencies]
elf = { version = "0.8", default-features = false, features = ["alloc"] }
feox-boot = { path = "../../crates/feox-boot" }
uefi = { version = "0.37", features = ["alloc", "global_allocator", "panic_handler"] }

[lints]
workspace = true
