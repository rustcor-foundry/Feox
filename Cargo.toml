[workspace]
members = [
    "crates/feox-asi",
    "crates/feox-async",
    "crates/feox-boot",
    "crates/feox-nvme",
    "kernel/feox-xokernel",
    "loader/feox-loader-uefi",
]
resolver = "2"

[workspace.package]
authors = ["Feox Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"
