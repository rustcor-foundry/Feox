[workspace]
members = [
    "crates/feox-asi",
    "crates/feox-async",
    "crates/feox-boot",
    "crates/feox-nvme",
    "kernel/feox-xokernel",
    "loader/feox-loader-uefi",
]
resolver = "2"

[workspace.package]
authors = ["Feox Contributors"]
edition = "2024"
license = "MIT OR Apache-2.0"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
module_name_repetitions = "allow"
pedantic = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "deny"

# rfs-feox (a git dependency from the RFS repo) itself depends on feox-nvme
# via git on THIS repo; redirect that to the local path crate so there is one
# feox-nvme and its types unify with the kernel's.
[patch."https://github.com/rustcor-foundry/Feox.git"]
feox-nvme = { path = "crates/feox-nvme" }
