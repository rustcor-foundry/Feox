name: ai-coding-session

on:
  workflow_dispatch:
    inputs:
      purpose:
        description: "Why this coding run is happening"
        required: true
        default: "Tracked coding session"
      model_route:
        description: "Tracked model route label"
        required: true
        default: "local-nearfile"
      command:
        description: "Shell command to run from the repo root"
        required: true
        default: "git status --short && git branch --show-current"

jobs:
  coding-session:
    runs-on: [self-hosted, linux, lx-ws01]
    env:
      WSKY_API_URL: http://10.200.10.100:8787
      WSKY_PY: /opt/wsky-ai-control/.venv/bin/python
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show host identity
        run: |
          echo "runner=$(hostname)"
          echo "pwd=$PWD"

      - name: Toolchain preflight
        run: |
          "$WSKY_PY" -m wsky_ai_control.cli doctor --json

      - name: Run tracked coding session
        shell: bash
        env:
          PURPOSE: ${{ inputs.purpose }}
          MODEL_ROUTE: ${{ inputs.model_route }}
          CODING_COMMAND: ${{ inputs.command }}
        run: |
          set +e
          /usr/local/bin/wsky-run-agent-session \
            --path "$PWD" \
            --purpose "$PURPOSE" \
            --model-route "$MODEL_ROUTE" \
            -- bash -lc "$CODING_COMMAND" | tee runner-output.txt
          rc=${PIPESTATUS[0]}
          echo "$rc" > runner-exit-code.txt
          awk -F= '/^session_id=/{print $2}' runner-output.txt | tail -n1 > session-id.txt
          exit 0

      - name: Capture session diff
        if: always()
        shell: bash
        run: |
          if [ ! -s session-id.txt ]; then
            exit 0
          fi
          SESSION_ID="$(cat session-id.txt)"
          "$WSKY_PY" -m wsky_ai_control.cli capture-session-diff \
            --session-id "$SESSION_ID" \
            --path "$PWD" \
            --json > session-diff.json || true
          cat session-diff.json || true

      - name: Finish with command status
        if: always()
        shell: bash
        run: |
          rc="$(cat runner-exit-code.txt)"
          exit "$rc"
