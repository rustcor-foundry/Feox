name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Workspace host tests
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none,x86_64-unknown-uefi
      - run: cargo test

  kernel:
    name: Build x86_64 kernel
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-none
      - run: cargo kernel

  loader:
    name: Build UEFI loader
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-uefi
      - run: cargo loader

  kernel-riscv:
    name: Build + smoke-boot riscv64 kernel
    runs-on: lx-ws01
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-none-elf
      - run: cargo kernel-riscv
      - name: Smoke-boot under QEMU (OpenSBI -> S-mode banner)
        run: |
          set -euo pipefail
          elf=target/riscv64gc-unknown-none-elf/debug/feox-xokernel
          log=$(mktemp)
          # Backing image so QEMU exposes an NVMe controller on the PCIe bus
          # for the kernel's milestone-6 device discovery.
          nvme_img=$(mktemp)
          truncate -s 16M "$nvme_img"
          # The boot hart parks in wfi, so bound the run. Capture serial to a
          # file (robust under CI's non-interactive stdio, unlike -serial stdio)
          # and assert the bring-up banner reached the SBI console.
          timeout -k 2 15 qemu-system-riscv64 \
            -machine virt -cpu rv64 -smp 4 -m 256M \
            -display none -monitor none -serial "file:$log" \
            -drive file="$nvme_img",if=none,id=nvm0,format=raw \
            -device nvme,serial=feox0,drive=nvm0 \
            -global virtio-mmio.force-legacy=false \
            -netdev user,id=net0 -device virtio-net-device,netdev=net0 \
            -bios default -kernel "$elf" -no-reboot </dev/null >/dev/null 2>&1 || true
          echo "----- serial log -----"; cat "$log"; echo "----------------------"
          grep -q 'breakpoint trap handled' "$log" \
            || { echo "::error::Feox riscv64 trap-handling marker not found"; exit 1; }
          grep -q 'sv39 paging enabled' "$log" \
            || { echo "::error::Feox riscv64 sv39-paging marker not found"; exit 1; }
          grep -q 'frame allocator online' "$log" \
            || { echo "::error::Feox riscv64 frame-allocator marker not found"; exit 1; }
          grep -q 'kernel heap online' "$log" \
            || { echo "::error::Feox riscv64 kernel-heap marker not found"; exit 1; }
          grep -q 'VM abstraction' "$log" \
            || { echo "::error::Feox riscv64 VM-abstraction marker not found"; exit 1; }
          grep -q 'sv39 walker' "$log" \
            || { echo "::error::Feox riscv64 sv39-walker marker not found"; exit 1; }
          grep -q 'text  : va=.* \[r-x\]' "$log" \
            || { echo "::error::Feox riscv64 kernel text is not mapped r-x (W^X check)"; exit 1; }
          grep -q 'feox-async executor drained' "$log" \
            || { echo "::error::Feox riscv64 async-runtime marker not found"; exit 1; }
          grep -q 'NVMe controller discovered' "$log" \
            || { echo "::error::Feox riscv64 PCIe/NVMe discovery marker not found"; exit 1; }
          grep -q 'NVMe controller enabled' "$log" \
            || { echo "::error::Feox riscv64 NVMe controller-enable marker not found"; exit 1; }
          grep -q 'NVMe admin command round-trip complete' "$log" \
            || { echo "::error::Feox riscv64 NVMe identify round-trip marker not found"; exit 1; }
          grep -q 'NVMe block I/O verified' "$log" \
            || { echo "::error::Feox riscv64 NVMe block-I/O marker not found"; exit 1; }
          grep -q 'alive (S-mode' "$log" \
            || { echo "::error::Feox riscv64 secondary-hart marker not found"; exit 1; }
          grep -q 'SMP secondary harts up' "$log" \
            || { echo "::error::Feox riscv64 SMP marker not found"; exit 1; }
          grep -q 'virtio-net link up' "$log" \
            || { echo "::error::Feox riscv64 virtio-net ARP round-trip marker not found"; exit 1; }
          grep -q 'IPv4/ICMP ping ok' "$log" \
            || { echo "::error::Feox riscv64 ICMP ping marker not found"; exit 1; }
          grep -q 'networking complete' "$log" \
            || { echo "::error::Feox riscv64 UDP/DHCP marker not found"; exit 1; }
          grep -q 'supervisor timer interrupts' "$log" \
            || { echo "::error::Feox riscv64 timer-interrupt marker not found"; exit 1; }
          grep -q 'U-mode execution' "$log" \
            || { echo "::error::Feox riscv64 U-mode marker not found"; exit 1; }
          grep -q 'ASI syscall dispatch.*match=true' "$log" \
            || { echo "::error::Feox riscv64 ASI-syscall marker not found (or CapList mismatch)"; exit 1; }
          grep -q 'riscv64 bring-up alive' "$log" \
            || { echo "::error::Feox riscv64 boot marker not found"; exit 1; }
          echo "riscv64 smoke-boot markers observed (boot..smp + net + timer irq)."
