[package]
name = "feox-xokernel"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
runtime = ["dep:feox-async"]
storage = ["runtime", "dep:feox-nvme"]

[[bin]]
name = "feox-xokernel"
path = "src/main.rs"
test = false
bench = false

[dependencies]
feox-asi = { path = "../../crates/feox-asi" }
feox-async = { path = "../../crates/feox-async", optional = true }
feox-boot = { path = "../../crates/feox-boot" }
feox-nvme = { path = "../../crates/feox-nvme", optional = true }

[lints]
workspace = true
